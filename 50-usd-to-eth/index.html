<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>50 USD to ETH – Convert 50 US Dollars to Ethereum</title>
<meta name="description" content="Convert 50 USD to Ethereum (ETH) using the latest ETH price. See ETH and wei value for 50 US dollars.">
<link rel="canonical" href="https://ethereum-pulse.com/50-usd-to-eth">
<link rel="stylesheet" href="/styles.css">
</head>

<body>
<header class="wrap">
<a class="brand" href="/">Ethereum Pulse</a>
<nav class="nav">
<a href="/usd-to-eth">USD to ETH</a>
<a href="/#converters">Converters</a>
</nav>
</header>

<main class="wrap">
<section class="hero">
<h1>50 USD to ETH</h1>

<p class="subtitle">
Convert <strong>50 USD</strong> to <strong>Ethereum (ETH)</strong> and <strong>wei</strong> using the latest market price.
</p>

<div class="card">
<div class="row"><label>Amount</label><div class="fixed-currency">50 USD</div></div>

<input id="amount" value="50" style="display:none;">
<select id="currency" disabled style="display:none;"><option value="usd" selected></option></select>

<div class="results">
<div class="result"><div class="k">ETH</div><div class="v" id="ethOut">—</div></div>
<div class="result"><div class="k">Wei</div><div class="v" id="weiOut">—</div></div>
</div>

<div class="actions">
<button id="copyBtn">Copy</button>
<button id="refreshBtn" class="secondary">Refresh</button>
</div>
</div>

<section class="related">
<ul>
<li><a href="/10-usd-to-eth">10 USD to ETH</a></li>
<li><a href="/100-usd-to-eth">100 USD to ETH</a></li>
<li><a href="/1000-usd-to-eth">1000 USD to ETH</a></li>
</ul>
</section>

<footer class="footer">
<p>© <span id="year"></span> ethereum-pulse.com</p>
</footer>
</section>
</main>

<script src="/app.js" defer></script>
<script>document.getElementById("year").textContent=new Date().getFullYear();</script>
</body>
</html>
